<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- rounded square background -->
    <clipPath id="clip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>

    <!-- filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- gradients -->
    <linearGradient id="arc-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#4ECDC4" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#4ECDC4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFB347" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#FFB347" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#4ECDC4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg-g" cx="50%" cy="65%" r="50%">
      <stop offset="0%"   stop-color="#4ECDC4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-g" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#FF7B54" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF7B54" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- dark background rounded square -->
  <rect width="100" height="100" rx="22" fill="#0f1e35"/>

  <!-- subtle inner vignette -->
  <rect width="100" height="100" rx="22" fill="url(#bg-g)"/>

  <!-- clip everything to rounded square -->
  <g clip-path="url(#clip)">

    <!-- ambient bg glow -->
    <circle cx="50" cy="62" r="40" fill="url(#bg-g)"/>

    <!-- ground curve -->
    <path d="M 12 65 Q 50 75 88 65" stroke="#FFB347" stroke-width="1" stroke-linecap="round" opacity="0.15" fill="none"/>

    <!-- horizon line -->
    <line x1="10" y1="64" x2="90" y2="64" stroke="url(#line-g)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- outer atmosphere arc -->
    <path d="M 16 64 A 34 34 0 0 1 84 64" stroke="#4ECDC4" stroke-width="1.2" stroke-linecap="round" opacity="0.15" fill="none"/>

    <!-- mid arc -->
    <path d="M 22 64 A 28 28 0 0 1 78 64" stroke="url(#arc-g)" stroke-width="2" stroke-linecap="round" opacity="0.55" fill="none"/>

    <!-- inner arc — brightest -->
    <path d="M 30 64 A 20 20 0 0 1 70 64" stroke="#4ECDC4" stroke-width="2.8" stroke-linecap="round" opacity="1" fill="none" filter="url(#glow)"/>

    <!-- sun corona -->
    <circle cx="50" cy="46" r="9" fill="#FF7B54" opacity="0.12"/>

    <!-- sun -->
    <circle cx="50" cy="46" r="6" fill="url(#sun-g)" filter="url(#dotglow)"/>

    <!-- rays -->
    <line x1="50"   y1="37"   x2="50"   y2="33"   stroke="#FF7B54" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="57.5" y1="39"   x2="60.5" y2="35.5" stroke="#FF7B54" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="42.5" y1="39"   x2="39.5" y2="35.5" stroke="#FF7B54" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <line x1="62"   y1="46"   x2="66.5" y2="46"   stroke="#FF7B54" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    <line x1="38"   y1="46"   x2="33.5" y2="46"   stroke="#FF7B54" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    <line x1="59"   y1="52.5" x2="62"   y2="56"   stroke="#FF7B54" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    <line x1="41"   y1="52.5" x2="38"   y2="56"   stroke="#FF7B54" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>

    <!-- horizon reflection dots -->
    <circle cx="32" cy="64" r="1.3" fill="#4ECDC4" opacity="0.45"/>
    <circle cx="41" cy="64" r="1"   fill="#4ECDC4" opacity="0.3"/>
    <circle cx="50" cy="64" r="1.8" fill="#4ECDC4" opacity="0.7"/>
    <circle cx="59" cy="64" r="1"   fill="#4ECDC4" opacity="0.3"/>
    <circle cx="68" cy="64" r="1.3" fill="#4ECDC4" opacity="0.45"/>

  </g>
</svg>
